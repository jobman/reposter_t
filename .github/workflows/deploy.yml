name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create test environment
        run: |
          python3 -m venv .test-venv
          .test-venv/bin/python -m pip install --disable-pip-version-check --quiet --upgrade pip
          .test-venv/bin/python -m pip install --disable-pip-version-check --quiet '.[dev]'

      - name: Lint
        run: |
          .test-venv/bin/ruff check .
          .test-venv/bin/ruff format --check .

      - name: Test
        run: .test-venv/bin/pytest -q

      - name: Deploy atomically
        run: bash scripts/deploy.sh
