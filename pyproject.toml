[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "reposter-t"
version = "0.1.0"
description = "Telegram media queue that publishes anonymized posts to a private channel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram==3.30.0",
  "aiosqlite>=0.21,<1",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
reposter-bot = "reposter_bot.main:run"

[tool.hatch.build.targets.wheel]
packages = ["reposter_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
